name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Fixordium 26.2
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Verify final jar
        run: |
          mkdir -p dist
          cp build/libs/fixordium-1.0.2.jar dist/fixordium.jar
          jar tf dist/fixordium.jar | grep 'dev/fixpot47/fixordium/FixordiumClient.class'
          jar tf dist/fixordium.jar | grep 'dev/fixpot47/fixordium/FixordiumSodiumConfig.class'
          jar tf dist/fixordium.jar | grep 'dev/fixpot47/fixordium/FixordiumAnimationOptimizer.class'
          jar tf dist/fixordium.jar | grep 'dev/fixpot47/fixordium/FixordiumDebugHud.class'
          jar tf dist/fixordium.jar | grep 'assets/fixordium/icon.png'
          jar tf dist/fixordium.jar | grep 'fixordium.mixins.json'

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: fixordium-1.0.2-mc26.2
          path: dist/fixordium.jar
